naftiko: 1.0.0-alpha2
info:
  label: Nomba Virtual Accounts API — Virtual Accounts
  description: 'Nomba Virtual Accounts API — Virtual Accounts. 5 operations. Lead operation: Create a virtual account. Self-contained
    Naftiko capability covering one Nomba business surface.'
  tags:
  - Nomba
  - Virtual Accounts
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    NOMBA_API_KEY: NOMBA_API_KEY
capability:
  consumes:
  - type: http
    namespace: virtual-accounts-virtual-accounts
    baseUri: https://api.nomba.com
    description: Nomba Virtual Accounts API — Virtual Accounts business capability. Self-contained, no shared references.
    resources:
    - name: v1-accounts-virtual
      path: /v1/accounts/virtual
      operations:
      - name: createvirtualaccount
        method: POST
        description: Create a virtual account
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v1-accounts-virtual-filter
      path: /v1/accounts/virtual/filter
      operations:
      - name: filtervirtualaccounts
        method: POST
        description: Filter virtual accounts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: v1-accounts-virtual-accountRef
      path: /v1/accounts/virtual/{accountRef}
      operations:
      - name: fetchvirtualaccount
        method: GET
        description: Fetch a virtual account
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatevirtualaccount
        method: PUT
        description: Update a virtual account
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v1-accounts-virtual-identifier
      path: /v1/accounts/virtual/{identifier}
      operations:
      - name: expirevirtualaccount
        method: DELETE
        description: Expire a virtual account
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: identifier
          in: path
          type: string
          description: The unique identifier of the virtual account to expire.
          required: true
    authentication:
      type: bearer
      token: '{{env.NOMBA_API_KEY}}'
  exposes:
  - type: rest
    namespace: virtual-accounts-virtual-accounts-rest
    port: 8080
    description: REST adapter for Nomba Virtual Accounts API — Virtual Accounts. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/v1/accounts/virtual
      name: v1-accounts-virtual
      description: REST surface for v1-accounts-virtual.
      operations:
      - method: POST
        name: createvirtualaccount
        description: Create a virtual account
        call: virtual-accounts-virtual-accounts.createvirtualaccount
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/accounts/virtual/filter
      name: v1-accounts-virtual-filter
      description: REST surface for v1-accounts-virtual-filter.
      operations:
      - method: POST
        name: filtervirtualaccounts
        description: Filter virtual accounts
        call: virtual-accounts-virtual-accounts.filtervirtualaccounts
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/accounts/virtual/{accountref}
      name: v1-accounts-virtual-accountref
      description: REST surface for v1-accounts-virtual-accountRef.
      operations:
      - method: GET
        name: fetchvirtualaccount
        description: Fetch a virtual account
        call: virtual-accounts-virtual-accounts.fetchvirtualaccount
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updatevirtualaccount
        description: Update a virtual account
        call: virtual-accounts-virtual-accounts.updatevirtualaccount
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/accounts/virtual/{identifier}
      name: v1-accounts-virtual-identifier
      description: REST surface for v1-accounts-virtual-identifier.
      operations:
      - method: DELETE
        name: expirevirtualaccount
        description: Expire a virtual account
        call: virtual-accounts-virtual-accounts.expirevirtualaccount
        with:
          identifier: rest.identifier
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: virtual-accounts-virtual-accounts-mcp
    port: 9090
    transport: http
    description: MCP adapter for Nomba Virtual Accounts API — Virtual Accounts. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: create-virtual-account
      description: Create a virtual account
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: virtual-accounts-virtual-accounts.createvirtualaccount
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: filter-virtual-accounts
      description: Filter virtual accounts
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: virtual-accounts-virtual-accounts.filtervirtualaccounts
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: fetch-virtual-account
      description: Fetch a virtual account
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: virtual-accounts-virtual-accounts.fetchvirtualaccount
      outputParameters:
      - type: object
        mapping: $.
    - name: update-virtual-account
      description: Update a virtual account
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: virtual-accounts-virtual-accounts.updatevirtualaccount
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: expire-virtual-account
      description: Expire a virtual account
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: virtual-accounts-virtual-accounts.expirevirtualaccount
      with:
        identifier: tools.identifier
      outputParameters:
      - type: object
