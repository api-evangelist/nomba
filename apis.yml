apis:
- aid: nomba:checkout-sdk
  name: Nomba Checkout SDK
  description: >-
    The Nomba Checkout SDK provides pre-built plugins and client libraries for integrating Nomba payment
    acceptance into websites and mobile applications. It includes an iOS SDK and e-commerce plugins such
    as a WooCommerce gateway for WordPress. The SDK supports Visa, Verve, and Mastercard payments along
    with USSD, bank transfers, and Nomba QR, enabling merchants to quickly add payment capabilities without
    building a custom checkout flow.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.nomba.com/plugins-and-sdk/overview
  baseURL: https://api.nomba.com
  tags:
  - SDK
  - Checkout
  - Plugins
  - E-Commerce
  properties:
  - type: Documentation
    url: https://developer.nomba.com/plugins-and-sdk/overview
