specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Nomba
providerId: nomba
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - FinOps
  - FOCUS
  - Payments
  - Fintech
  - Nigeria
notes: Nomba does not publicly post per-transaction take rates or terminal pricing. FinOps shape captured
  here describes the typical Nigerian payment-processor billing pattern (per-transaction fees on cards
  / transfers / USSD / QR, plus POS terminal hardware sales). Reconcile against the merchant onboarding
  agreement.
description: 'FOCUS-aligned FinOps for Nomba: per-transaction fees on cards, bank transfers, USSD/QR,
  and cross-border payouts, plus POS terminal hardware sales. Settlement currency is NGN with USD/EUR
  for cross-border lines.'
sources:
  - https://nomba.com/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Nomba
serviceCategory: Payments
billingModel:
  pricingCategory: Take Rate + Hardware
  billingFrequency: Continuous Settlement
  billingCurrency: NGN (settlement varies)
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Adjustment
    - Refund
focusColumns:
  ServiceName: Nomba
  ServiceCategory: Payments
  ServiceSubcategory: Card / Bank Transfer / POS
  ProviderName: Nomba
  PublisherName: Nomba
  InvoiceIssuerName: Nomba
  BillingCurrency: NGN
  RegionId: NG
  PricingCategory: Take Rate
meters:
  - name: card_transactions
    description: Card payments processed via Nomba.
    unit: transaction
    aggregation: sum
    dimensions:
      - card_brand
      - currency
      - merchant
  - name: bank_transfers
    description: Bank transfer transactions.
    unit: transaction
    aggregation: sum
    dimensions:
      - direction
      - currency
      - merchant
  - name: ussd_qr_transactions
    description: USSD and QR-code payment transactions.
    unit: transaction
    aggregation: sum
    dimensions:
      - channel
      - merchant
  - name: virtual_account_inflows
    description: Inflows received on Nomba virtual accounts.
    unit: transaction
    aggregation: sum
    dimensions:
      - merchant
  - name: cross_border_payouts
    description: Cross-border payout volume.
    unit: transaction
    aggregation: sum
    dimensions:
      - corridor
      - currency
      - merchant
  - name: pos_terminal_units
    description: POS terminals deployed.
    unit: terminal-month
    aggregation: avg
    dimensions:
      - merchant
      - region
principles:
  - name: Visibility
    description: Use Nomba merchant dashboard and the Transactions / Settlements API to attribute revenue
      and fees per channel and per merchant.
  - name: Allocation
    description: Tag transactions with merchant_id and channel; map sub-merchants under platform accounts
      for chargeback / showback.
  - name: Optimization
    description: Route low-value payments via USSD / QR (typically lower fees than card); consolidate
      payouts to reduce per-transaction overhead; right-size POS terminal fleet per location footprint.
  - name: Accountability
    description: Reconcile Nomba settlements daily against the merchant ledger; investigate take-rate
      and FX variances on cross-border payouts; review terminal utilization against fixed-cost recovery.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
