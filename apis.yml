aid: nomba
name: Nomba
description: >-
  Nomba is a Nigerian fintech platform that provides payment infrastructure for businesses, offering APIs for payment
  acceptance, transfers, virtual accounts, and cross-border payouts. Their developer platform enables merchants and
  platforms to integrate card payments, bank transfers, USSD, and QR code payments into applications.
