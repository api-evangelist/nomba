aid: nomba
url: https://raw.githubusercontent.com/api-evangelist/nomba/refs/heads/main/apis.yml
modified: '2026-03-24'
apis:
  - aid: nomba:authentication
    name: Nomba Authentication API
    tags:
      - Authentication
      - OAuth2
      - Security
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://api.nomba.com
    humanURL: https://developer.nomba.com/nomba-api-reference/authenticate/obtain-access-token
    properties:
      - url: https://developer.nomba.com/nomba-api-reference/authenticate/obtain-access-token
        type: Documentation
      - url: openapi/nomba-authentication-openapi.yml
        type: OpenAPI
    description: >-
      The Nomba Authentication API provides OAuth2-based authentication for
      accessing all Nomba API endpoints. It supports two authentication methods:
      Client-Credentials for server-to-server integrations and PKCE (Proof Key
      for Code Exchange) for client-side applications. Developers obtain HTTP
      bearer tokens that are used to authorize subsequent API calls across the
      Nomba platform.
  - aid: nomba:accounts
    name: Nomba Accounts API
    tags:
      - Accounts
      - Financial Services
      - Terminals
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://api.nomba.com
    humanURL: https://developer.nomba.com/nomba-api-reference/accounts/fetch-terminals-assigned-to-an-account
    properties:
      - url: https://developer.nomba.com/nomba-api-reference/accounts/fetch-terminals-assigned-to-an-account
        type: Documentation
      - url: openapi/nomba-accounts-openapi.yml
        type: OpenAPI
    description: >-
      The Nomba Accounts API enables developers to manage business accounts on
      the Nomba platform. It provides endpoints for retrieving account details,
      fetching terminals assigned to an account, and managing account-level
      configurations. This API serves as the foundation for account management
      operations within the Nomba ecosystem.
  - aid: nomba:virtual-accounts
    name: Nomba Virtual Accounts API
    tags:
      - Virtual Accounts
      - Payments
      - Collections
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://api.nomba.com
    humanURL: https://developer.nomba.com/nomba-api-reference/virtual-accounts/create-virtual-account
    properties:
      - url: https://developer.nomba.com/nomba-api-reference/virtual-accounts/create-virtual-account
        type: Documentation
      - url: openapi/nomba-virtual-accounts-openapi.yml
        type: OpenAPI
    description: >-
      The Nomba Virtual Accounts API allows developers to create and manage
      virtual bank accounts for receiving payments. There is no fixed limit to
      the number of virtual accounts that can be created for customers. The API
      supports creating, expiring, and managing virtual accounts, enabling
      businesses to collect payments via bank transfers with unique account
      numbers assigned to individual customers or transactions.
  - aid: nomba:transfers
    name: Nomba Transfers API
    tags:
      - Transfers
      - Payments
      - Banking
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://api.nomba.com
    humanURL: https://developer.nomba.com/nomba-api-reference/transfers/fetch-bank-codes-and-names
    properties:
      - url: https://developer.nomba.com/nomba-api-reference/transfers/fetch-bank-codes-and-names
        type: Documentation
      - url: openapi/nomba-transfers-openapi.yml
        type: OpenAPI
    description: >-
      The Nomba Transfers API provides endpoints for initiating and managing
      fund transfers. Developers can look up bank codes and names, verify
      account details, and initiate transfers to Nigerian bank accounts. The
      API supports domestic money transfers and provides the necessary bank
      metadata for building payment flows within applications.
  - aid: nomba:online-checkout
    name: Nomba Online Checkout API
    tags:
      - Checkout
      - Payments
      - E-Commerce
      - Cards
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://api.nomba.com
    humanURL: https://developer.nomba.com/nomba-api-reference/online-checkout/create-an-online-checkout-order
    properties:
      - url: https://developer.nomba.com/nomba-api-reference/online-checkout/create-an-online-checkout-order
        type: Documentation
      - url: openapi/nomba-online-checkout-openapi.yml
        type: OpenAPI
    description: >-
      The Nomba Online Checkout API enables developers to create checkout
      orders and process payments through multiple channels. It supports Visa,
      Verve, and Mastercard payments, as well as USSD, bank transfers, and
      Nomba QR payments. The API includes tokenized card payment capabilities,
      allowing merchants to charge returning customers without requiring them
      to re-enter card details.
  - aid: nomba:charge
    name: Nomba Charge API
    tags:
      - Payments
      - Cards
      - Tokenization
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://api.nomba.com
    humanURL: https://developer.nomba.com/nomba-api-reference/charge/submit-customer-card-otp
    properties:
      - url: https://developer.nomba.com/nomba-api-reference/charge/submit-customer-card-otp
        type: Documentation
      - url: openapi/nomba-charge-openapi.yml
        type: OpenAPI
    description: >-
      The Nomba Charge API provides direct card charging capabilities for
      developers building payment solutions. It supports OTP submission for
      card transactions, retrieval of user saved cards, and tokenized card
      charging. This API is designed for merchants and platforms that need
      programmatic control over the card payment flow, including handling
      3D Secure authentication steps.
  - aid: nomba:transactions
    name: Nomba Transactions API
    tags:
      - Transactions
      - Reporting
      - Financial Data
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://api.nomba.com
    humanURL: https://developer.nomba.com/products/transactions/fetch-account-transactions
    properties:
      - url: https://developer.nomba.com/products/transactions/fetch-account-transactions
        type: Documentation
      - url: openapi/nomba-transactions-openapi.yml
        type: OpenAPI
    description: >-
      The Nomba Transactions API allows developers to retrieve and manage
      transaction records. It provides endpoints for fetching account
      transaction history, querying transaction details, and processing
      refunds. This API is essential for building reporting dashboards,
      reconciliation tools, and transaction monitoring systems on top of
      the Nomba platform.
  - aid: nomba:global-payout
    name: Nomba Global Payout API
    tags:
      - Cross-Border Payments
      - Payouts
      - Foreign Exchange
      - Stablecoins
      - Remittance
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://api.nomba.com
    humanURL: https://developer.nomba.com/docs/products/global-payout/introduction
    properties:
      - url: https://developer.nomba.com/docs/products/global-payout/introduction
        type: Documentation
      - url: openapi/nomba-global-payout-openapi.yml
        type: OpenAPI
    description: >-
      The Nomba Global Payout API is a single integration point that enables
      cross-border payment operators, remittance platforms, and fintechs to
      collect funds in Nigerian Naira or stablecoins (USDT/USDC) and trigger
      instant disbursements to the United Kingdom via Faster Payments, Europe
      via SEPA, Canada via Interac and bank transfer, and the Democratic
      Republic of Congo via Mobile Money. The API embeds FX sourcing and
      compliance directly into the technical layer, eliminating the need for
      operators to manage foreign exchange processes. It solves capital lockups
      in cross-border trade by handling currency conversion automatically when
      funds land in a virtual account.
  - aid: nomba:checkout-sdk
    name: Nomba Checkout SDK
    tags:
      - SDK
      - Checkout
      - Plugins
      - E-Commerce
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://api.nomba.com
    humanURL: https://developer.nomba.com/plugins-and-sdk/overview
    properties:
      - url: https://developer.nomba.com/plugins-and-sdk/overview
        type: Documentation
    description: >-
      The Nomba Checkout SDK provides pre-built plugins and client libraries
      for integrating Nomba payment acceptance into websites and mobile
      applications. It includes an iOS SDK and e-commerce plugins such as a
      WooCommerce gateway for WordPress. The SDK supports Visa, Verve, and
      Mastercard payments along with USSD, bank transfers, and Nomba QR,
      enabling merchants to quickly add payment capabilities without building
      a custom checkout flow.
