specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Nomba
providerId: nomba
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Payments
  - Fintech
  - Nigeria
  - Cards
  - Transfers
notes: Nomba's public marketing site (nomba.com) does not expose self-service per-transaction pricing
  for the API or POS terminals. Pricing is typically merchant-onboarded and the API documentation host
  (docs.api.nomba.com) was unreachable at reconciliation time. Reconcile against merchant onboarding
  docs or direct merchant agreement when available.
description: Nomba is a Nigerian payment platform offering APIs for card acceptance, bank transfers,
  USSD, QR, virtual accounts, and cross-border payouts, plus a POS terminal business. Public per-transaction
  pricing is not posted on the marketing site — fees are configured at merchant onboarding under bilateral
  agreements typical of Nigerian payment processors.
sources:
  - https://nomba.com/
  - https://docs.api.nomba.com/
plans:
  - id: nomba-merchant
    name: Nomba Merchant Account
    type: usage-based
    description: Merchant account with API access for payments, transfers, virtual accounts, and POS
      terminals. Per-transaction fees configured at onboarding.
    entries:
      - label: Card transaction fee
        name: card_transaction_fee
        type: metered
        metric: transaction
        limit: -1
        timeFrame: usage
        geo: NG
        unit: 1
        price: see merchant agreement
        userMultiplied: false
      - label: Bank transfer fee
        name: bank_transfer_fee
        type: metered
        metric: transaction
        limit: -1
        timeFrame: usage
        geo: NG
        unit: 1
        price: see merchant agreement
        userMultiplied: false
      - label: USSD / QR fee
        name: ussd_qr_fee
        type: metered
        metric: transaction
        limit: -1
        timeFrame: usage
        geo: NG
        unit: 1
        price: see merchant agreement
        userMultiplied: false
      - label: Cross-border payout
        name: cross_border_payout_fee
        type: metered
        metric: transaction
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: see merchant agreement
        userMultiplied: false
      - label: POS terminal
        name: pos_terminal
        type: flat
        metric: terminal
        limit: -1
        timeFrame: usage
        geo: NG
        unit: 1
        price: see Nomba sales
        userMultiplied: false
    elements:
      - name: Card payments
      - name: Bank transfers
      - name: USSD payments
      - name: QR code payments
      - name: Virtual accounts
      - name: Cross-border payouts
      - name: POS terminals (hardware)
